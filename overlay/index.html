<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>dsh-lol-augment overlay</title>
    <style>
      :root {
        --gold: #d8b45a;
        --ink: rgba(8, 12, 16, 0.86);
        --line: rgba(255, 255, 255, 0.14);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
        color: #f4f7fa;
        user-select: none;
      }
      #stage { position: fixed; inset: 0; pointer-events: none; }
      #video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
      body.calibrating #video { display: block; }
      body.calibrating #stage { pointer-events: auto; }

      .badge {
        position: fixed;
        transform: translate(-50%, -50%);
        min-width: 168px;
        padding: 6px 10px 7px;
        border-radius: 10px;
        background: var(--ink);
        border: 1px solid var(--line);
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
        text-align: center;
      }
      .badge .grade {
        font-size: 26px;
        font-weight: 800;
        line-height: 1.05;
        letter-spacing: 0.5px;
      }
      .badge .name { font-size: 12px; opacity: 0.92; margin-top: 2px; white-space: nowrap; }
      .badge .meta { font-size: 11px; opacity: 0.6; margin-top: 1px; }
      .badge.S .grade { color: #ffd76a; }
      .badge.A .grade { color: #8fe08a; }
      .badge.B .grade { color: #7fc8ff; }
      .badge.C .grade { color: #c9c9c9; }
      .badge.D .grade { color: #ff8f8f; }
      .badge.q .grade { color: #ffb866; }
      .badge.keep { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 6px 18px rgba(0, 0, 0, 0.5); }
      .badge.reroll::after {
        content: "重置";
        position: absolute;
        top: -9px;
        right: -8px;
        background: #2b6ef2;
        color: #fff;
        font-size: 10px;
        padding: 2px 6px;
        border-radius: 999px;
      }
      .badge .conf { position: absolute; left: 6px; top: -8px; font-size: 9px; opacity: 0.55; }

      #plan {
        position: fixed;
        left: 50%;
        bottom: 7%;
        transform: translateX(-50%);
        max-width: 78vw;
        padding: 10px 16px;
        border-radius: 12px;
        background: var(--ink);
        border: 1px solid var(--line);
        font-size: 15px;
        line-height: 1.45;
        display: none;
      }
      #plan b { color: var(--gold); }

      #hint {
        position: fixed;
        left: 50%;
        top: 4%;
        transform: translateX(-50%);
        padding: 7px 13px;
        border-radius: 999px;
        background: var(--ink);
        border: 1px solid var(--line);
        font-size: 12.5px;
        display: none;
      }

      #calibPanel {
        position: fixed;
        left: 50%;
        bottom: 6%;
        transform: translateX(-50%);
        display: none;
        gap: 10px;
        align-items: center;
        padding: 12px 16px;
        border-radius: 12px;
        background: var(--ink);
        border: 1px solid var(--line);
        pointer-events: auto;
      }
      body.calibrating #calibPanel { display: flex; }
      .toolbtn {
        pointer-events: auto;
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.08);
        color: #f4f7fa;
        font-size: 13px;
        cursor: pointer;
      }
      .toolbtn:hover { background: rgba(255, 255, 255, 0.16); }
      .toolbtn.primary { background: #2b6ef2; border-color: #2b6ef2; }
      .dot {
        position: fixed;
        width: 26px; height: 26px;
        margin: -13px 0 0 -13px;
        border-radius: 50%;
        border: 2px solid #fff;
        background: rgba(43, 110, 242, 0.55);
        pointer-events: none;
        font-size: 11px;
        line-height: 22px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <video id="video" autoplay muted playsinline></video>
    <div id="stage">
      <div id="badges"></div>
      <div id="plan"></div>
      <div id="hint"></div>
      <div id="calibPanel">
        <span id="calibText">点击三张卡的图标中心（依次 1/2/3）</span>
        <button class="toolbtn" id="btnReset">重来</button>
        <button class="toolbtn primary" id="btnSave" disabled>保存布局</button>
        <button class="toolbtn" id="btnCancel">取消</button>
      </div>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
